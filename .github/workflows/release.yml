name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: verify
        run: |
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go test -race ./...

      # make dist is the release directory the install workflow tests install.sh
      # against on every push, so the two cannot drift apart.
      - name: build all platforms
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
