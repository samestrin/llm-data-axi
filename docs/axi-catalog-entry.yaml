# DRAFT catalog entry for kunchenguid/axi `catalog.yaml`, `community` list.
#
# This file is a draft, not a submission. Nothing here has been sent to
# kunchenguid/axi. The owner submits it (the PR is public).
#
# In kunchenguid/axi, `catalog.yaml` is the single source of truth: the README
# and docs tables are generated from it, and `docs:check` fails on a
# hand-edited generated region.
#
# Steps the owner runs:
#   1. Fork kunchenguid/axi and branch from its main.
#   2. Append the `- name: llm-data-axi` entry below (without these comments)
#      to the `community` list in catalog.yaml.
#   3. Check `reviewed_revision` is still the release commit (see below).
#   4. Run `pnpm run docs:gen` to regenerate README.md and docs/index.html, and
#      commit all three files (catalog.yaml, README.md, docs/index.html)
#      together (CI `docs:check` fails on drift).
#   5. Push through the `no-mistakes` gate (`no-mistakes init --fork-url
#      git@github.com:<you>/axi.git`, then `git push no-mistakes`). It runs the
#      pipeline and opens the PR.
#
# `reviewed_revision` names the commit the v2.0.2 tag carries
# (git rev-parse v2.0.2^{commit} = 2e6ea2d). The observations below and
# docs/axi-audit.md describe that commit: the rows the pre-tag fixes changed
# were re-probed on a build of it, and every line cite in the audit was
# re-checked against it. v2.0.2 is the first tag to carry
# internal/data/commands/catalog_entry_test.go, which fails when the counts,
# the cited files or the exception drift from the code. If a later release
# changes what an observation says, re-pin to that release's commit.
#
# The token figures are quoted from benchmarks/RESULTS.md. If that file
# changes, re-quote them here.
- name: llm-data-axi
  url: https://github.com/samestrin/llm-data-axi
  author: samestrin
  domain: Project files / YAML
  description: "Inspects and transforms files, projects and YAML configuration with deterministic, network-free commands; across twelve command/repository pairs (24 runs) its default TOON output was 39.3% smaller than the same commands' JSON (183,846 vs 302,691 bytes)."
  admission:
    status: exception
    reviewed_revision: 2e6ea2deda677235dfb5e4829a9ea79c10addbdd
    reviewed_components:
      - README.md
      - docs/axi-audit.md
      - benchmarks/RESULTS.md
      - skills/llm-data/SKILL.md
      - cmd/llm-data/main.go
      - cmd/llm-data-mcp/main.go
      - internal/data/commands/root.go
      - internal/data/commands/moved.go
      - internal/data/commands/grep.go
      - internal/data/commands/multigrep.go
      - internal/data/commands/setup.go
      - internal/data/mcpserver/handlers.go
      - internal/noweb_guard_test.go
    source_observations:
      - "llm-data --help lists 18 commands (plus cobra's completion and help); yaml has 4 yaml subcommands (get, set, multiget, multiset). --help exits 0 on every one. plan-type, project-components, tier-classifier and diff-smell moved to cadence in v2.0.0; calling one exits 2 with an error naming the cadence command that replaces it."
      - "TOON is the default output of every command, help[] included: a run with no format flag and a run with --axi print the same bytes. --json prints JSON, --plain prints text, --min shortens --json output and has no effect on TOON; under --plain it shortens text, template included (v2.0.0 answered template --plain --min with minimal JSON; v2.0.1 fixes it), and --plain with --json or --axi is a usage error naming both flags. The MCP server (llm-data-mcp) asks the CLI for TOON unless a call asks for JSON or LLM_DATA_MCP_AXI=false, and a command that exits non-zero is an isError: true result carrying the CLI's own error output. Every value built from tool input reaches the CLI after a --, so a value spelled like an option (a yaml_multiset key --file=h.yaml) is data, not an option, and the template tool passes --literal-vars, so a vars value starting with @ is substituted as given and no file is read."
      - "docs/axi-audit.md marks principles 1-8 and 10 as met and 9 as partly met within a stated scope. Default rows are 3-4 fields (grep {file,text}, multigrep {content,file,line}, tree {name,path,type}, stats {count,extension,size}); grep cuts lines at 200 bytes and multigrep at 80 with truncated, full_length and a --full next step; grep and multigrep always report a total, 0 included; stats, tree and catfiles report 0 on an empty directory, exit 0; a missing path is an error, exit 1, never zero matches."
      - "Every error is on stdout in the active format with stderr empty: a TOON error/message document by default, one JSON document under --json, an Error: line under --plain (the bare message under --plain --min). Exit codes are 0 success, 1 error, 2 usage error (unknown flag, bad flag value, wrong argument count, unknown or moved command); an unknown flag's error lists the command's valid flags, and every exit-2 error carries a help list with the missing flag, the usage line and the command's --help. An unknown enum value or out-of-range number (count --mode bogus, tree --depth -1) and a yaml set key that names no value (\"\", a..b) and a template --var with no = or no key are usage errors. A partial result is an error: template --strict with an undefined variable, catfiles and grep with an unreadable entry, and multigrep --output-dir with a file it cannot write each exit 1 and list what failed. yaml set of the value a key already holds leaves the file byte-identical; a yaml write keeps the file's mode, writes a symlink's target and leaves no lock file on Linux and macOS (on Windows its <file>.lock stays), and yaml get, multiget and --dry-run write nothing. A FIFO or device is never read: named outright it is an error, found in a directory it is skipped and listed. template -o and multigrep --output-dir write only to a new path or a regular file: a FIFO, device, directory or symlink at the target is refused and nothing is written. A yaml write that adds a key keeps the file's comments and key order. Nothing prompts, and yaml's stdin reader refuses a terminal."
      - "A bare llm-data run prints the binary path (home directory as ~), a one-sentence description, the repository root, project type and git change count, and two help[] next steps, exit 0; outside a repository it says so instead. Each git call has its own 2-second budget."
      - "llm-data setup --target claude,codex,opencode registers a SessionStart hook in .claude/settings.json plus an Agent Skill, a SessionStart hook in .codex/hooks.json with [features] hooks = true in .codex/config.toml, and a plugin at .opencode/plugins/llm-data.js that adds the home view to each session. The default target is claude; --dry-run writes nothing; a second run changes no bytes; it writes only inside the project and never prompts. The committed skills/llm-data/SKILL.md is byte-identical to the one setup writes."
      - "tree, stats, multigrep, grep, catfiles, highest and git-context print paths relative to the working directory by default; --absolute restores absolute paths and any other command rejects it."
      - "Nothing in the tool makes a network call: internal/noweb_guard_test.go fails the build if a non-test file under internal/, pkg/ or cmd/ imports net, net/http or goquery."
      - "benchmarks/RESULTS.md: six read-only commands, each run once with --json and once with --axi, on this repository and on spf13/cobra@v1.8.0. Twelve command/repository pairs, 24 runs, measured with llm-data 2.0.2 at the llm-data-axi commit RESULTS.md names, from a clean checkout. Total 302,691 JSON bytes (~75,672 tokens) against 183,846 TOON bytes (~45,961 tokens), 39.3% saved. Tokens are bytes/4, not a tokenizer count."
    exception: "Two stated remainders, as in docs/axi-audit.md: (1) there is no session-end lifecycle-capture hook, because llm-data keeps no session state (no transcript, no record of files touched) and has nothing of its own to capture; the session-start half ships for Claude Code, Codex and OpenCode. (2) help[] next steps are scoped, not universal: the home view, an empty grep or multigrep, a truncated search line, a catfiles run cut at --max-size and every exit-2 error carry them, other commands do not."
