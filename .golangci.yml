# golangci-lint config (v2.12.2), matching the selection used across
# samestrin/atcr and samestrin/go-axi so rules cannot drift between the
# projects that share this toolchain.
#
# Linter selection is pinned explicitly (errcheck, govet, ineffassign,
# staticcheck) so local runs are a stable, reproducible subset, not a
# relaxation introduced to silence findings. CI does not run golangci-lint:
# it runs gofmt -s, go vet and go test -race (.github/workflows/test.yml), so
# this config governs local linting only.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
